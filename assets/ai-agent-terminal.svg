<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'SF Mono','Menlo','Consolas','Hiragino Kaku Gothic ProN',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1019"/>
      <stop offset="100%" stop-color="#1a1b2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="12" fill="url(#bg)"/>

  <!-- Title bar -->
  <rect width="800" height="36" rx="12" fill="#252640"/>
  <rect y="12" width="800" height="24" fill="#252640"/>
  <circle cx="18" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="54" cy="18" r="5.5" fill="#28c840"/>
  <text x="400" y="22" text-anchor="middle" fill="#8888aa" font-size="11" font-weight="600">AI Agent Architecture — Orchestrator Pattern</text>

  <!-- ===== TOOL LOGOS (top right) ===== -->
  <!-- OpenClaw logo -->
  <g transform="translate(680, 6)">
    <rect width="48" height="24" rx="4" fill="#1e1f35" stroke="#6366f1" stroke-width="1"/>
    <circle cx="14" cy="12" r="6" fill="none" stroke="#f97316" stroke-width="1.8"/>
    <path d="M11,10 L14,8 L17,10" fill="none" stroke="#f97316" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="12" cy="13" r="1" fill="#f97316"/>
    <circle cx="16" cy="13" r="1" fill="#f97316"/>
    <text x="28" y="16" fill="#f97316" font-size="7" font-weight="700">OC</text>
  </g>
  <!-- Claude Code logo -->
  <g transform="translate(734, 6)">
    <rect width="54" height="24" rx="4" fill="#1e1f35" stroke="#d4a574" stroke-width="1"/>
    <text x="8" y="16" fill="#d4a574" font-size="12" font-weight="700">&gt;_</text>
    <text x="28" y="16" fill="#d4a574" font-size="7" font-weight="700">CC</text>
  </g>

