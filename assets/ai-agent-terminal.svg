  <text x="30" y="68" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">DESIGN METHODOLOGY</text>

  <!-- Powered by badges -->
  <g transform="translate(220, 56)">
    <rect width="76" height="18" rx="9" fill="#2d1a0a" stroke="#f97316" stroke-width="0.8"/>
    <circle cx="10" cy="9" r="4.5" fill="none" stroke="#f97316" stroke-width="1.2"/>
    <path d="M8,8 L10,6.5 L12,8" fill="none" stroke="#f97316" stroke-width="0.8" stroke-linecap="round"/>
    <circle cx="9" cy="10" r="0.7" fill="#f97316"/>
    <circle cx="11" cy="10" r="0.7" fill="#f97316"/>
    <text x="18" y="13" fill="#f97316" font-size="7.5" font-weight="700">OpenClaw</text>
  </g>
  <g transform="translate(302, 56)">
    <rect width="82" height="18" rx="9" fill="#1a1510" stroke="#d4a574" stroke-width="0.8"/>
    <text x="8" y="13" fill="#d4a574" font-size="9" font-weight="700">&gt;_</text>
    <text x="22" y="13" fill="#d4a574" font-size="7.5" font-weight="700">Claude Code</text>
