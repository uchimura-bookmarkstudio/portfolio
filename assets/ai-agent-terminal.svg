  <text x="44" y="172" fill="#28c840" font-size="9" font-weight="700" letter-spacing="1">STEP 2</text>
  <text x="100" y="172" fill="#e2e8f0" font-size="12" font-weight="700">複数Worker + Human-in-the-Loop</text>
  <text x="44" y="187" fill="#8888aa" font-size="10">人間が手動でつなぐ。受け渡しとレビューを明確化</text>
  <text x="44" y="203" fill="#28c840" font-size="9">単体安定 / データ形式統一 / レビューポイント明確</text>

  <!-- Arrow -->
