  <rect x="406" y="46" width="380" height="440" rx="8" fill="#1a1b30" stroke="#2d2e4a" stroke-width="1"/>
  <text x="422" y="68" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">LIVE SYSTEM — AI BPaaS</text>

