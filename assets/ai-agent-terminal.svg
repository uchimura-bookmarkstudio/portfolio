  <!-- Step 3 -->
  <rect x="28" y="228" width="352" height="58" rx="6" fill="#262747" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="28" y="228" width="4" height="58" rx="2" fill="#fbbf24"/>
  <text x="44" y="245" fill="#fbbf24" font-size="9" font-weight="700" letter-spacing="1">STEP 3</text>
  <text x="100" y="245" fill="#e2e8f0" font-size="12" font-weight="700">Orchestrator導入</text>
  <text x="44" y="260" fill="#8888aa" font-size="10">AIがつなぐ — Planner / Router / Judge</text>
  <text x="44" y="276" fill="#fbbf24" font-size="9">タスク分解 / 振り分け / 評価 / 次の判断</text>

  <!-- Design order -->
  <text x="30" y="310" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">AGENT DESIGN ORDER</text>
  <rect x="28" y="320" width="352" height="152" rx="6" fill="#1e1f35" stroke="#2d2e4a" stroke-width="1"/>

  <text x="44" y="342" fill="#6366f1" font-size="10" font-weight="700">1</text>
  <text x="60" y="342" fill="#c8c8e0" font-size="11">Goal / Policy — 目的と方針の定義</text>
  <text x="44" y="362" fill="#6366f1" font-size="10" font-weight="700">2</text>
  <text x="60" y="362" fill="#c8c8e0" font-size="11">Data / Memory — RAG・ナレッジ基盤構築</text>
  <text x="44" y="382" fill="#6366f1" font-size="10" font-weight="700">3</text>
  <text x="60" y="382" fill="#c8c8e0" font-size="11">Functional Agent — 単機能エージェント実装</text>
  <text x="44" y="402" fill="#6366f1" font-size="10" font-weight="700">4</text>
  <text x="60" y="402" fill="#c8c8e0" font-size="11">Orchestrator — 統合・判断・ルーティング</text>
  <text x="44" y="422" fill="#6366f1" font-size="10" font-weight="700">5</text>
  <text x="60" y="422" fill="#c8c8e0" font-size="11">Domain Skill + Tool接続 — 業務特化スキル</text>
  <text x="44" y="442" fill="#6366f1" font-size="10" font-weight="700">6</text>
  <text x="60" y="442" fill="#c8c8e0" font-size="11">Reflection Loop — 自己修正・品質改善</text>

