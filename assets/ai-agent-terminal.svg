  <line x1="660" y1="126" x2="730" y2="150" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Worker 1 -->
  <rect x="420" y="150" width="100" height="58" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <circle cx="438" cy="166" r="7" fill="#6366f1"/>
  <text x="438" y="170" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W1</text>
  <text x="470" y="170" fill="#c8c8e0" font-size="9" font-weight="600">請求書AI</text>
  <text x="432" y="186" fill="#8888aa" font-size="8">OCR読取→仕訳</text>
  <text x="432" y="198" fill="#8888aa" font-size="8">→自動起票</text>

  <!-- Worker 2 -->
  <rect x="546" y="150" width="108" height="58" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <circle cx="564" cy="166" r="7" fill="#28c840"/>
  <text x="564" y="170" text-anchor="middle" fill="#fff" font-size="8" font-weight="700">W2</text>
  <text x="596" y="170" fill="#c8c8e0" font-size="9" font-weight="600">議事録Agent</text>
  <text x="558" y="186" fill="#8888aa" font-size="8">録音→文字起こし</text>
  <text x="558" y="198" fill="#8888aa" font-size="8">→要約→Action抽出</text>

  <!-- Worker 3 -->
  <rect x="680" y="150" width="94" height="58" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <circle cx="698" cy="166" r="7" fill="#fbbf24"/>
  <text x="698" y="170" text-anchor="middle" fill="#1a1b2e" font-size="8" font-weight="700">W3</text>
  <text x="727" y="170" fill="#c8c8e0" font-size="9" font-weight="600">AI社長</text>
  <text x="692" y="186" fill="#8888aa" font-size="8">RAG+経営判断</text>
  <text x="692" y="198" fill="#8888aa" font-size="8">→意思決定支援</text>

  <!-- HIL Review -->
  <rect x="420" y="228" width="354" height="40" rx="6" fill="#1e2a1e" stroke="#28c840" stroke-width="1"/>
  <text x="440" y="244" fill="#28c840" font-size="9" font-weight="700" letter-spacing="1">HUMAN-IN-THE-LOOP</text>
  <text x="440" y="260" fill="#86efac" font-size="9">人は「例外判断」と「最終承認」のみ。作業の80%はAIが自律実行</text>

  <!-- Tool connections -->
  <text x="422" y="290" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">AGENT PLATFORM</text>

  <!-- OpenClaw badge (large) -->
  <rect x="420" y="298" width="170" height="40" rx="6" fill="#262747" stroke="#f97316" stroke-width="1.2"/>
  <circle cx="442" cy="318" r="9" fill="none" stroke="#f97316" stroke-width="2"/>
  <path d="M438,315 L442,312 L446,315" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="440" cy="320" r="1.2" fill="#f97316"/>
  <circle cx="444" cy="320" r="1.2" fill="#f97316"/>
  <text x="458" y="314" fill="#f97316" font-size="11" font-weight="700">OpenClaw</text>
  <text x="458" y="328" fill="#8888aa" font-size="8">OSS Agent Framework</text>

  <!-- Claude Code badge (large) -->
  <rect x="600" y="298" width="174" height="40" rx="6" fill="#262747" stroke="#d4a574" stroke-width="1.2"/>
  <text x="618" y="322" fill="#d4a574" font-size="16" font-weight="800">&gt;_</text>
  <text x="642" y="314" fill="#d4a574" font-size="11" font-weight="700">Claude Code</text>
  <text x="642" y="328" fill="#8888aa" font-size="8">Anthropic CLI Agent</text>

  <!-- Tool row -->
  <rect x="420" y="348" width="108" height="32" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <text x="474" y="369" text-anchor="middle" fill="#c8c8e0" font-size="10">Claude API</text>

  <rect x="540" y="348" width="108" height="32" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <text x="594" y="369" text-anchor="middle" fill="#c8c8e0" font-size="10">Google Workspace</text>

  <rect x="660" y="348" width="108" height="32" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <text x="714" y="369" text-anchor="middle" fill="#c8c8e0" font-size="10">n8n / Slack</text>

  <!-- RAG section -->
  <text x="422" y="402" fill="#a78bfa" font-size="10" font-weight="700" letter-spacing="1.5">RAG / KNOWLEDGE BASE</text>
  <rect x="420" y="410" width="354" height="64" rx="6" fill="#1e1f35" stroke="#2d2e4a" stroke-width="1"/>
  <text x="436" y="430" fill="#c8c8e0" font-size="10">Hybrid Search: キーワード + セマンティック検索</text>
  <text x="436" y="446" fill="#c8c8e0" font-size="10">チャンク設計: 意味のある最小単位 + メタデータ付与</text>
  <text x="436" y="464" fill="#8888aa" font-size="9">議事録 / 契約書 / 業務マニュアル / 商談履歴 → ベクトルDB</text>
</svg>