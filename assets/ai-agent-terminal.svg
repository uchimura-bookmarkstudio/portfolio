  <!-- Step 1 -->
  <rect x="28" y="82" width="352" height="58" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
  <rect x="28" y="82" width="4" height="58" rx="2" fill="#6366f1"/>
  <text x="44" y="99" fill="#a78bfa" font-size="9" font-weight="700" letter-spacing="1">STEP 1</text>
  <text x="100" y="99" fill="#e2e8f0" font-size="12" font-weight="700">単体Worker</text>
  <text x="44" y="114" fill="#8888aa" font-size="10">1体 x 1タスク x フロー型で確実に動く状態を作る</text>
  <text x="44" y="130" fill="#6366f1" font-size="9">トリガー発火 / 品質安定 / エラー対応 / 人間に戻せる</text>

  <!-- Arrow -->
  <polygon points="200,143 204,151 196,151" fill="#6366f1"/>

  <!-- Step 2 -->
  <rect x="28" y="155" width="352" height="58" rx="6" fill="#262747" stroke="#3d3e6a" stroke-width="1"/>
